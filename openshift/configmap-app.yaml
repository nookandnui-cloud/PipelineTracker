apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-tracker-app
  namespace: mfec-pipeline-tools
  labels:
    app: pipeline-tracker
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="th">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Pipeline Tracker</title>
      <link rel="stylesheet" href="styles.css">
      <script src="libs/xlsx.full.min.js"></script>
    </head>
    <body>
      <div id="app"></div>
      <script src="js/app.js"></script>
    </body>
    </html>
  styles.css: |
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
    #app { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { font-size: 24px; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; background: #007bff; color: white; }
    .btn:hover { background: #0056b3; }
    .btn-secondary { background: #6c757d; }
    .btn-secondary:hover { background: #545b62; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #007bff; color: white; }
    .upload-area { border: 2px dashed #ccc; padding: 40px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    .upload-area.dragover { border-color: #007bff; background: #e8f4ff; }
